[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=7
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
# URLs are never mouse-clickable in foot. Control+Shift+o labels every URL on screen;
# type its label to open it. Control+Shift+u is NOT free here, it is unicode-input.
show-urls-launch=Control+Shift+o
show-urls-copy=Control+Shift+y

[url]
launch=xdg-open ${url}
# Home-row letters, so a label is reachable without looking down.
label-letters=sadfjklewcmpgh
# Also label OSC-8 hyperlinks, not just bare URLs.
osc8-underline=always

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

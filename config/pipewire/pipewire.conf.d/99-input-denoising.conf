# RNNoise noise suppression for the laptop mic / headset jack.
# Creates a virtual source "Noise Canceled Mic". Delete this file and
# run `systemctl --user restart pipewire` to undo.
context.modules = [
{   name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
        node.description = "Noise Canceled Mic"
        media.name       = "Noise Canceled Mic"
        filter.graph = {
            nodes = [
                {
                    type   = ladspa
                    name   = rnnoise
                    plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                    label  = noise_suppressor_mono
                    control = {
                        "VAD Threshold (%)"          = 50.0
                        "VAD Grace Period (ms)"      = 200
                        "Retroactive VAD Grace (ms)" = 0
                    }
                }
            ]
        }
        capture.props = {
            node.name      = "capture.rnnoise_source"
            node.passive   = true
            audio.rate     = 48000
            target.object  = "alsa_input.pci-0000_00_1f.3.analog-stereo"
        }
        playback.props = {
            node.name      = "rnnoise_source"
            media.class    = Audio/Source
            audio.rate     = 48000
        }
    }
}
]
